[package]
name = "icloud-s3"
version = "0.1.0"
edition = "2021"
description = "An S3-compatible object store backed by iCloud Shared Photo Albums. Quota policy: Apple's Shared Album loophole."
license = "MIT"
repository = "https://github.com/ashayas/icloud-s3"
keywords = ["s3", "icloud", "photos", "storage", "satire"]
categories = ["database", "command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "icloud-s3"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
percent-encoding = "2.3"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
